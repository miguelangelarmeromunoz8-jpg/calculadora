<div class="botones-grid">
  <button
    *ngFor="let btn of botones"
    (click)="presionar(btn)"
    [ngClass]="{
      'btn': true,
      'igual': btn === '=',
      'limpiar': btn === 'C',
      'operador': btn === '+' || btn === '-' || btn === '*' || btn === '/',
      'vacio': btn === ''
    }"
  >
    {{ btn }}
  </button>
</div>
